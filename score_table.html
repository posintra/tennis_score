<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score 데이터 보기</title>
  <style>
    body {
      margin: 0;
      background: #f3f7f0;
      font-family: "Segoe UI", sans-serif;
      color: #1f3b2d;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      word-break: break-all;
    }

    .back-btn {
      margin-bottom: 16px;
      border: none;
      border-radius: 8px;
      background: #1f3b2d;
      color: #fff;
      padding: 10px 14px;
      cursor: pointer;
    }

    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border: 1px solid #c7d4c8;
      border-radius: 10px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
    }

    th, td {
      border: 1px solid #d6e0d7;
      padding: 10px;
      text-align: center;
      white-space: nowrap;
      font-size: 14px;
    }

    th {
      background: #e7f2e9;
    }

    .msg {
      background: #fff;
      border: 1px solid #c7d4c8;
      border-radius: 10px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <main class="container">
    <button class="back-btn" type="button" onclick="location.href='score_list.html'">목록으로</button>
    <h1 id="title">파일 데이터</h1>
    <div id="content" class="msg">데이터를 불러오는 중...</div>
  </main>

  <script>
    function parseCsv(text) {
      const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter((line) => line.trim().length > 0);
      if (lines.length === 0) return { headers: [], rows: [] };

      const parseLine = (line) => {
        const result = [];
        let cur = "";
        let quoted = false;

        for (let i = 0; i < line.length; i += 1) {
          const ch = line[i];
          if (ch === '"') {
            if (quoted && line[i + 1] === '"') {
              cur += '"';
              i += 1;
            } else {
              quoted = !quoted;
            }
          } else if (ch === ',' && !quoted) {
            result.push(cur);
            cur = "";
          } else {
            cur += ch;
          }
        }

        result.push(cur);
        return result;
      };

      const headers = parseLine(lines[0]);
      const rows = lines.slice(1).map(parseLine);
      return { headers, rows };
    }

    async function loadCsvTable() {
      const params = new URLSearchParams(location.search);
      const file = params.get("file");
      const title = document.getElementById("title");
      const content = document.getElementById("content");

      if (!file) {
        content.textContent = "파일명이 없습니다.";
        return;
      }

      title.textContent = file;

      try {
        const response = await fetch(`score_view/${file}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("CSV 파일을 읽을 수 없습니다.");
        }

        const text = await response.text();
        const { headers, rows } = parseCsv(text);

        if (headers.length === 0) {
          content.textContent = "CSV 데이터가 비어 있습니다.";
          return;
        }

        const wrap = document.createElement("div");
        wrap.className = "table-wrap";

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const trHead = document.createElement("tr");

        headers.forEach((h) => {
          const th = document.createElement("th");
          th.textContent = h;
          trHead.appendChild(th);
        });

        thead.appendChild(trHead);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        rows.forEach((row) => {
          const tr = document.createElement("tr");
          headers.forEach((_, idx) => {
            const td = document.createElement("td");
            td.textContent = row[idx] ?? "";
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        wrap.appendChild(table);

        content.className = "";
        content.innerHTML = "";
        content.appendChild(wrap);
      } catch (error) {
        content.textContent = `데이터를 불러오지 못했습니다: ${error.message}`;
      }
    }

    loadCsvTable();
  </script>
</body>
</html>
